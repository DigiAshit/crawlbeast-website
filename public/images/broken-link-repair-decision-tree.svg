<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Broken link repair decision tree</title>
  <desc id="desc">Decision tree chooses update, restore, redirect, remove, or investigate based on destination context.</desc>
  <rect width="1200" height="760" fill="#f7f9fc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172a3a">Choose the repair by destination intent</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="425" y="90" width="350" height="78" rx="7" fill="#172a3a"/><text x="600" y="123" font-size="19" font-weight="700" fill="#ffffff">IS THE FAILURE CONFIRMED</text><text x="600" y="149" font-size="16" fill="#dbe7f1">for users and a second check?</text>
    <path d="M600 168v55M600 223H245M600 223h355" stroke="#6b7f93" stroke-width="3" fill="none"/>
    <text x="398" y="214" font-size="15" font-weight="700" fill="#176b4b">YES</text><text x="800" y="214" font-size="15" font-weight="700" fill="#8a4b00">NO</text>
    <rect x="90" y="238" width="310" height="78" rx="7" fill="#dcecff" stroke="#6d9ed4"/><text x="245" y="272" font-size="18" font-weight="700" fill="#174a7e">DOES A VALID PAGE EXIST</text><text x="245" y="297" font-size="15" fill="#31465a">at a new URL?</text>
    <rect x="800" y="238" width="310" height="78" rx="7" fill="#fff0dc" stroke="#dda158"/><text x="955" y="272" font-size="18" font-weight="700" fill="#8a4b00">RECHECK / INVESTIGATE</text><text x="955" y="297" font-size="15" fill="#31465a">rate limit, access, DNS, server</text>
    <path d="M245 316v54M245 370H110M245 370h270" stroke="#6b7f93" stroke-width="3" fill="none"/>
    <text x="165" y="360" font-size="15" font-weight="700" fill="#176b4b">YES</text><text x="385" y="360" font-size="15" font-weight="700" fill="#8a4b00">NO</text>
    <rect x="35" y="385" width="300" height="92" rx="7" fill="#e4f6ed" stroke="#5eae83"/><text x="185" y="420" font-size="18" font-weight="700" fill="#176b4b">UPDATE THE LINK DIRECTLY</text><text x="185" y="449" font-size="15" fill="#31465a">Keep redirect for external references</text>
    <rect x="365" y="385" width="300" height="92" rx="7" fill="#f0eafb" stroke="#9274c4"/><text x="515" y="420" font-size="18" font-weight="700" fill="#55348d">SHOULD THE PAGE EXIST?</text><text x="515" y="449" font-size="15" fill="#31465a">Was removal accidental?</text>
    <path d="M515 477v62M515 539H345M515 539h350" stroke="#6b7f93" stroke-width="3" fill="none"/>
    <text x="420" y="529" font-size="15" font-weight="700" fill="#176b4b">YES</text><text x="700" y="529" font-size="15" font-weight="700" fill="#8a4b00">NO</text>
    <rect x="195" y="554" width="300" height="92" rx="7" fill="#e4f6ed" stroke="#5eae83"/><text x="345" y="589" font-size="18" font-weight="700" fill="#176b4b">RESTORE THE PAGE</text><text x="345" y="618" font-size="15" fill="#31465a">then verify content and status</text>
    <rect x="535" y="554" width="330" height="92" rx="7" fill="#fff0dc" stroke="#dda158"/><text x="700" y="589" font-size="18" font-weight="700" fill="#8a4b00">REMOVE THE ACTIVE LINK</text><text x="700" y="618" font-size="15" fill="#31465a">404/410 is valid without equivalent</text>
    <rect x="885" y="554" width="280" height="92" rx="7" fill="#dcecff" stroke="#6d9ed4"/><text x="1025" y="589" font-size="18" font-weight="700" fill="#174a7e">RELEVANT EQUIVALENT?</text><text x="1025" y="618" font-size="15" fill="#31465a">add one-hop permanent redirect</text>
    <path d="M865 600h18" stroke="#6b7f93" stroke-width="3"/>
  </g>
  <rect x="90" y="686" width="1020" height="44" rx="5" fill="#172a3a"/>
  <text x="600" y="714" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Never redirect unrelated missing URLs to the homepage just to remove an error count.</text>
</svg>
