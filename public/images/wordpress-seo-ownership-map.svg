<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">WordPress SEO ownership map</title><desc id="desc">Five WordPress layers can create SEO outputs and conflicts.</desc>
  <rect width="1200" height="720" fill="#f7f9fc"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172a3a">Trace every scalable symptom to an owner</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="110" width="1040" height="92" rx="7" fill="#dcecff" stroke="#6d9ed4"/><text x="115" y="150" font-size="20" font-weight="700" fill="#174a7e">WORDPRESS CORE</text><text x="360" y="150" font-size="17" fill="#31465a">Visibility • permalinks • reading • media • content types</text><text x="115" y="180" font-size="15" fill="#51677b">Confirm the setting and then confirm live output.</text>
    <rect x="120" y="220" width="960" height="92" rx="7" fill="#e4f6ed" stroke="#5eae83"/><text x="155" y="260" font-size="20" font-weight="700" fill="#176b4b">THEME / BUILDER</text><text x="400" y="260" font-size="17" fill="#31465a">HTML • headings • navigation • templates • schema</text><text x="155" y="290" font-size="15" fill="#51677b">Compare representative templates and devices.</text>
    <rect x="160" y="330" width="880" height="92" rx="7" fill="#fff0dc" stroke="#dda158"/><text x="195" y="370" font-size="20" font-weight="700" fill="#8a4b00">PLUGINS</text><text x="400" y="370" font-size="17" fill="#31465a">Canonicals • robots • sitemaps • redirects • cache</text><text x="195" y="400" font-size="15" fill="#51677b">Assign one intended owner per function.</text>
    <rect x="200" y="440" width="800" height="92" rx="7" fill="#f0eafb" stroke="#9274c4"/><text x="235" y="480" font-size="20" font-weight="700" fill="#55348d">HOST / CDN</text><text x="430" y="480" font-size="17" fill="#31465a">Status • HTTPS • headers • cache • uptime</text><text x="235" y="510" font-size="15" fill="#51677b">Check whether edge behavior overrides the application.</text>
    <rect x="240" y="550" width="720" height="92" rx="7" fill="#ffe8e4" stroke="#d56d60"/><text x="275" y="590" font-size="20" font-weight="700" fill="#9b3428">CONTENT MODEL</text><text x="500" y="590" font-size="17" fill="#31465a">Pages • posts • taxonomies • authors • media</text><text x="275" y="620" font-size="15" fill="#51677b">Decide which generated URLs deserve search visibility.</text>
  </g>
  <text x="600" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172a3a">When two layers own one signal, conflicts and regressions become likely.</text>
</svg>
