<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agency website crawler evaluation framework</title>
  <desc id="desc">Four layers evaluate crawl truth, interpretation, delivery, and portfolio fit.</desc>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172a3a">Evaluate the workflow, not just the feature list</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="125" width="1020" height="112" rx="8" fill="#dcecff" stroke="#6d9ed4" stroke-width="2"/>
    <text x="125" y="170" font-size="22" font-weight="700" fill="#174a7e">1. CRAWL TRUTH</text><text x="125" y="205" font-size="18" fill="#31465a">Coverage • configuration • rendering • authentication • source evidence</text>
    <rect x="135" y="257" width="930" height="112" rx="8" fill="#e4f6ed" stroke="#5eae83" stroke-width="2"/>
    <text x="170" y="302" font-size="22" font-weight="700" fill="#176b4b">2. INTERPRETATION</text><text x="170" y="337" font-size="18" fill="#31465a">Segmentation • validation • prioritization • crawl comparison</text>
    <rect x="180" y="389" width="840" height="112" rx="8" fill="#fff0dc" stroke="#dda158" stroke-width="2"/>
    <text x="215" y="434" font-size="22" font-weight="700" fill="#8a4b00">3. DELIVERY</text><text x="215" y="469" font-size="18" fill="#31465a">Client explanation • exports • tickets • acceptance criteria</text>
    <rect x="225" y="521" width="750" height="112" rx="8" fill="#f0eafb" stroke="#9274c4" stroke-width="2"/>
    <text x="260" y="566" font-size="22" font-weight="700" fill="#55348d">4. PORTFOLIO FIT</text><text x="260" y="601" font-size="18" fill="#31465a">Projects • people • privacy • reliability • realistic total cost</text>
  </g>
  <text x="600" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172a3a">A crawler passes only when all four layers support the agency's recurring job.</text>
</svg>
