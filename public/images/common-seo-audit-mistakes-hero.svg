<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Common SEO audit mistakes</title><desc id="desc">A review process separates raw crawl warnings from validated, owned SEO work.</desc><rect width="1200" height="630" fill="#f7f9fc"/><rect x="58" y="54" width="1084" height="522" rx="8" fill="#fff" stroke="#ccd5e1" stroke-width="2"/><rect x="58" y="54" width="1084" height="70" rx="8" fill="#172a3a"/><text x="95" y="98" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">TURN AUDIT NOISE INTO VERIFIED ACTION</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="110" y="200" width="250" height="150" rx="8" fill="#ffe9e2" stroke="#d77b67" stroke-width="2"/><text x="235" y="253" font-size="22" font-weight="700" fill="#8d311f">RAW WARNINGS</text><text x="235" y="287" font-size="17" fill="#31465a">Every issue looks urgent</text><path d="M374 275h145" stroke="#6b7f93" stroke-width="4"/><path d="m505 265 14 10-14 10" fill="none" stroke="#6b7f93" stroke-width="4"/><rect x="535" y="200" width="250" height="150" rx="8" fill="#fff3e4" stroke="#e5a24b" stroke-width="2"/><text x="660" y="253" font-size="22" font-weight="700" fill="#8a4b00">VALIDATE</text><text x="660" y="287" font-size="17" fill="#31465a">Evidence and context</text><path d="M799 275h145" stroke="#6b7f93" stroke-width="4"/><path d="m930 265 14 10-14 10" fill="none" stroke="#6b7f93" stroke-width="4"/><rect x="960" y="200" width="130" height="150" rx="8" fill="#eaf7ef" stroke="#69b78d" stroke-width="2"/><text x="1025" y="253" font-size="22" font-weight="700" fill="#176b4b">ACT</text><text x="1025" y="287" font-size="17" fill="#31465a">Owner</text><text x="1025" y="312" font-size="17" fill="#31465a">and proof</text><text x="600" y="462" font-size="25" font-weight="700" fill="#172a3a">THE AUDIT IS NOT THE DELIVERABLE. THE DECISION IS.</text></g></svg>
