<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">WordPress SEO audit</title><desc id="desc">Live page output is traced back to WordPress core, theme, plugins, hosting, and content.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/><rect x="55" y="52" width="1090" height="526" rx="8" fill="#ffffff" stroke="#ccd5e1" stroke-width="2"/>
  <rect x="55" y="52" width="1090" height="70" rx="8" fill="#172a3a"/><text x="90" y="96" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">WORDPRESS SEO AUDIT • OUTPUT BACK TO OWNERSHIP</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="85" y="170" width="310" height="310" rx="7" fill="#dcecff" stroke="#6d9ed4"/><text x="240" y="215" font-size="20" font-weight="700" fill="#174a7e">LIVE PAGE OUTPUT</text><rect x="120" y="245" width="240" height="45" rx="5" fill="#ffffff"/><text x="240" y="273" font-size="15" fill="#31465a">Status • canonical • robots</text><rect x="120" y="310" width="240" height="45" rx="5" fill="#ffffff"/><text x="240" y="338" font-size="15" fill="#31465a">Titles • links • schema</text><rect x="120" y="375" width="240" height="45" rx="5" fill="#ffffff"/><text x="240" y="403" font-size="15" fill="#31465a">Render • speed • content</text>
    <path d="M395 325h90" stroke="#6b7f93" stroke-width="6"/><path d="m470 311 18 14-18 14" fill="none" stroke="#6b7f93" stroke-width="6"/>
    <rect x="510" y="145" width="600" height="360" rx="7" fill="#172a3a"/><text x="810" y="190" font-size="19" font-weight="700" fill="#9fc5ef">WHICH SYSTEM OWNS THE PATTERN?</text>
    <g font-size="18" fill="#ffffff"><rect x="555" y="225" width="230" height="58" rx="5" fill="#174a7e"/><text x="670" y="261">WORDPRESS CORE</text><rect x="835" y="225" width="230" height="58" rx="5" fill="#176b4b"/><text x="950" y="261">THEME / BUILDER</text><rect x="555" y="305" width="230" height="58" rx="5" fill="#8a4b00"/><text x="670" y="341">PLUGINS</text><rect x="835" y="305" width="230" height="58" rx="5" fill="#55348d"/><text x="950" y="341">HOST / CDN</text><rect x="695" y="385" width="230" height="58" rx="5" fill="#9b3428"/><text x="810" y="421">CONTENT MODEL</text></g>
  </g>
  <text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172a3a">Fix the responsible layer, then verify the final page again.</text>
</svg>
