<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Technical SEO audit checklist</title>
  <desc id="desc">A priority-first technical SEO checklist moves from search access through site architecture to validation.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="65" y="56" width="1070" height="520" rx="8" fill="#ffffff" stroke="#ccd5e1" stroke-width="2"/>
  <rect x="65" y="56" width="1070" height="70" rx="8" fill="#172a3a"/>
  <text x="103" y="101" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">TECHNICAL SEO AUDIT: PRIORITY-FIRST CHECKLIST</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <g fill="#eaf3ff" stroke="#77a8de" stroke-width="2"><rect x="115" y="174" width="220" height="116" rx="7"/><rect x="385" y="174" width="220" height="116" rx="7"/></g>
    <g fill="#eaf7ef" stroke="#69b78d" stroke-width="2"><rect x="655" y="174" width="220" height="116" rx="7"/><rect x="925" y="174" width="160" height="116" rx="7"/></g>
