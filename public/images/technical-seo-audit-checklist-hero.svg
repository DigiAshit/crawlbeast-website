    <g text-anchor="middle" fill="#172a3a"><text x="225" y="219" font-weight="700">1. BASELINE</text><text x="225" y="251">Access and evidence</text><text x="495" y="219" font-weight="700">2. CRAWL</text><text x="495" y="251">Scope and validate</text><text x="765" y="219" font-weight="700">3. INDEX</text><text x="765" y="251">Robots, sitemaps, canonicals</text><text x="1005" y="219" font-weight="700">4. URLS</text><text x="1005" y="251">Status and redirects</text><text x="360" y="407" font-weight="700">5. ARCHITECTURE</text><text x="360" y="439">Links and depth</text><text x="630" y="407" font-weight="700">6. EXPERIENCE</text><text x="630" y="439">Performance and rendering</text><text x="900" y="407" font-weight="700">7. VERIFY</text><text x="900" y="439">Owners and re-crawl</text></g>
    <path d="M335 232h42M605 232h42M875 232h42M1005 291v28H360v42M470 420h42M740 420h42" fill="none" stroke="#6b7f93" stroke-width="4"/>
