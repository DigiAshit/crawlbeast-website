<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Law firm page type audit matrix</title><desc id="desc">Practice, location, attorney, guide, results, and contact pages have different audit jobs.</desc>
  <rect width="1200" height="720" fill="#f7f9fc"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172a3a">One checklist cannot represent every law-firm page</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="105" width="1080" height="60" rx="6" fill="#172a3a"/><text x="90" y="143" font-size="18" font-weight="700" fill="#ffffff">PAGE TYPE</text><text x="340" y="143" font-size="18" font-weight="700" fill="#ffffff">PRIMARY JOB</text><text x="745" y="143" font-size="18" font-weight="700" fill="#ffffff">HIGH-RISK AUDIT QUESTIONS</text>
    <g font-size="16" fill="#31465a"><rect x="60" y="175" width="1080" height="72" fill="#dcecff"/><text x="90" y="218" font-weight="700">PRACTICE</text><text x="340" y="218">Match a legal need</text><text x="745" y="218">Scope, jurisdiction, expertise, CTA</text><rect x="60" y="247" width="1080" height="72" fill="#ffffff"/><text x="90" y="290" font-weight="700">LOCATION</text><text x="340" y="290">Prove local presence</text><text x="745" y="290">Office facts, attorneys, GBP, routing</text><rect x="60" y="319" width="1080" height="72" fill="#e4f6ed"/><text x="90" y="362" font-weight="700">ATTORNEY</text><text x="340" y="362">Establish identity</text><text x="745" y="362">Admissions, credentials, practice links</text><rect x="60" y="391" width="1080" height="72" fill="#ffffff"/><text x="90" y="434" font-weight="700">GUIDE</text><text x="340" y="434">Answer an early question</text><text x="745" y="434">Author, reviewer, date, jurisdiction, sources</text><rect x="60" y="463" width="1080" height="72" fill="#fff0dc"/><text x="90" y="506" font-weight="700">RESULT / REVIEW</text><text x="340" y="506">Support confidence</text><text x="745" y="506">Accuracy, context, permission, disclaimers</text><rect x="60" y="535" width="1080" height="72" fill="#ffffff"/><text x="90" y="578" font-weight="700">CONTACT</text><text x="340" y="578">Enable qualified intake</text><text x="745" y="578">Mobile UX, privacy, routing, measurement</text></g>
  </g>
  <rect x="60" y="632" width="1080" height="48" rx="5" fill="#172a3a"/><text x="600" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Sample each page type and the real states it can enter.</text>
</svg>
