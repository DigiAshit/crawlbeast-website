<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">SaaS SEO audit map</title><desc id="desc">A SaaS audit connects public marketing pages, documentation, application subdomains, and release workflows.</desc><rect width="1200" height="630" fill="#f7f9fc"/><rect x="60" y="54" width="1080" height="522" rx="8" fill="#fff" stroke="#ccd5e1" stroke-width="2"/><rect x="60" y="54" width="1080" height="70" rx="8" fill="#172a3a"/><text x="98" y="98" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">SAAS SEO AUDIT: MAP THE WHOLE PUBLIC SYSTEM</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="110" y="190" width="220" height="130" rx="8" fill="#eaf3ff" stroke="#77a8de" stroke-width="2"/><text x="220" y="237" font-size="20" font-weight="700" fill="#174a7e">MARKETING SITE</text><text x="220" y="270" font-size="16" fill="#31465a">Demand and conversion pages</text><rect x="390" y="190" width="220" height="130" rx="8" fill="#eaf7ef" stroke="#69b78d" stroke-width="2"/><text x="500" y="237" font-size="20" font-weight="700" fill="#176b4b">DOCUMENTATION</text><text x="500" y="270" font-size="16" fill="#31465a">Product answers and links</text><rect x="670" y="190" width="220" height="130" rx="8" fill="#fff3e4" stroke="#e5a24b" stroke-width="2"/><text x="780" y="237" font-size="20" font-weight="700" fill="#8a4b00">APP SURFACES</text><text x="780" y="270" font-size="16" fill="#31465a">Login, app, help, API</text><rect x="950" y="190" width="140" height="130" rx="8" fill="#f1edfb" stroke="#9a82c7" stroke-width="2"/><text x="1020" y="237" font-size="20" font-weight="700" fill="#5f488b">RELEASES</text><text x="1020" y="270" font-size="16" fill="#31465a">Changes</text><path d="M330 255h54M610 255h54M890 255h54" stroke="#6b7f93" stroke-width="4"/><rect x="250" y="410" width="700" height="72" rx="7" fill="#172a3a"/><text x="600" y="455" font-size="21" font-weight="700" fill="#fff">CRAWL, INDEX, RENDER, MEASURE, RELEASE, VERIFY</text></g></svg>
