<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Shopify SEO audit map</title><desc id="desc">A Shopify audit follows product, collection, theme, and URL rules through a store.</desc><rect width="1200" height="630" fill="#f7f9fc"/><rect x="60" y="54" width="1080" height="522" rx="8" fill="#fff" stroke="#ccd5e1" stroke-width="2"/><rect x="60" y="54" width="1080" height="70" rx="8" fill="#172a3a"/><text x="98" y="98" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">SHOPIFY SEO AUDIT: CHECK THE STORE AS A SYSTEM</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="188" width="200" height="145" rx="8" fill="#eaf3ff" stroke="#77a8de" stroke-width="2"/><text x="220" y="235" font-size="21" font-weight="700" fill="#174a7e">PRODUCTS</text><text x="220" y="267" font-size="16" fill="#31465a">Variants, schema, stock</text><rect x="390" y="188" width="200" height="145" rx="8" fill="#eaf7ef" stroke="#69b78d" stroke-width="2"/><text x="490" y="235" font-size="21" font-weight="700" fill="#176b4b">COLLECTIONS</text><text x="490" y="267" font-size="16" fill="#31465a">Hubs and filters</text><rect x="660" y="188" width="200" height="145" rx="8" fill="#fff3e4" stroke="#e5a24b" stroke-width="2"/><text x="760" y="235" font-size="21" font-weight="700" fill="#8a4b00">THEME</text><text x="760" y="267" font-size="16" fill="#31465a">Rendering and speed</text><rect x="930" y="188" width="150" height="145" rx="8" fill="#f1edfb" stroke="#9a82c7" stroke-width="2"/><text x="1005" y="235" font-size="21" font-weight="700" fill="#5f488b">URL RULES</text><text x="1005" y="267" font-size="16" fill="#31465a">Canonical paths</text><path d="M320 260h55M590 260h55M860 260h55" stroke="#6b7f93" stroke-width="4"/><text x="600" y="455" font-size="26" font-weight="700" fill="#172a3a">FIND TEMPLATE PATTERNS, NOT ONE-OFF WARNINGS</text></g></svg>
