<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">SEO crawler alternative decision matrix</title>
  <desc id="desc">A matrix connects common reasons for seeking an alternative to the appropriate type of SEO crawler.</desc>
  <rect width="1200" height="640" fill="#f7f9fc"/>
  <text x="65" y="74" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172a3a">Match the alternative to the friction</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="65" y="120" width="1070" height="410" rx="8" fill="#ffffff" stroke="#cbd6e2" stroke-width="2"/>
    <rect x="65" y="120" width="1070" height="60" rx="8" fill="#172a3a"/>
    <text x="104" y="158" font-weight="700" fill="#ffffff">IF YOUR FRICTION IS...</text><text x="618" y="158" font-weight="700" fill="#ffffff">START BY TESTING...</text>
    <g fill="#31465a"><text x="104" y="238">Raw crawl output takes too long to explain</text><text x="618" y="238">A guided, visual audit workflow</text>
    <text x="104" y="314">Separate clients need a clearer home</text><text x="618" y="314">A multi-project local workflow</text>
    <text x="104" y="390">Audit work is already inside a suite</text><text x="618" y="390">Semrush or Ahrefs site-audit modules</text>
    <text x="104" y="466">Scale, logs, and shared monitoring drive the job</text><text x="618" y="466">An enterprise technical platform</text></g>
    <path d="M86 263h1026M86 339h1026M86 415h1026M565 192v308" stroke="#d7e0ea" stroke-width="2"/>
  </g>
  <text x="600" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#51677b">Do not switch tools until a representative crawl proves the new workflow solves the actual friction.</text>
</svg>
