<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Why SEO audits take so long</title>
  <desc id="desc">A crawl timer feeds a longer process of validation, prioritization, handoff, and verification.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172a3a">THE CRAWL IS ONLY THE START OF THE CLOCK</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="175" cy="304" r="112" fill="#dcecff" stroke="#6d9ed4" stroke-width="4"/>
    <circle cx="175" cy="304" r="70" fill="#ffffff" stroke="#174a7e" stroke-width="5"/>
    <path d="M175 304V255M175 304l38 27" stroke="#174a7e" stroke-width="7" stroke-linecap="round"/>
    <text x="175" y="450" font-size="20" font-weight="700" fill="#174a7e">CRAWL AND COLLECT</text>
    <path d="M305 304h70" stroke="#6b7f93" stroke-width="6"/><path d="m360 290 18 14-18 14" fill="none" stroke="#6b7f93" stroke-width="6"/>
    <rect x="402" y="145" width="738" height="320" rx="8" fill="#172a3a"/>
    <g text-anchor="start"><text x="442" y="191" font-size="17" font-weight="700" fill="#9fc5ef">THE HUMAN WORK</text>
      <text x="442" y="245" font-size="22" font-weight="700" fill="#ffffff">1. RECONCILE EVIDENCE</text><text x="780" y="245" font-size="22" font-weight="700" fill="#ffffff">2. VALIDATE PATTERNS</text>
      <text x="442" y="315" font-size="22" font-weight="700" fill="#ffffff">3. FIND ROOT CAUSES</text><text x="780" y="315" font-size="22" font-weight="700" fill="#ffffff">4. PRIORITIZE DECISIONS</text>
      <text x="442" y="385" font-size="22" font-weight="700" fill="#ffffff">5. DESIGN THE HANDOFF</text><text x="780" y="385" font-size="22" font-weight="700" fill="#ffffff">6. PLAN VALIDATION</text>
    </g>
  </g>
  <rect x="60" y="518" width="1080" height="62" rx="6" fill="#e4f6ed" stroke="#5eae83"/>
  <text x="600" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#176b4b">Audit speed depends on scope clarity, evidence quality, and decision depth.</text>
</svg>
