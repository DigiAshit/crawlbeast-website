<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">What is a technical SEO audit</title><desc id="desc">A technical SEO audit moves from search access to a verified implementation plan.</desc><rect width="1200" height="630" fill="#f7f9fc"/><rect x="60" y="54" width="1080" height="522" rx="8" fill="#fff" stroke="#ccd5e1" stroke-width="2"/><rect x="60" y="54" width="1080" height="70" rx="8" fill="#172a3a"/><text x="98" y="98" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">A TECHNICAL SEO AUDIT IS A DECISION PROCESS</text><g font-family="Arial,sans-serif" text-anchor="middle" font-size="18"><rect x="115" y="220" width="180" height="115" rx="7" fill="#eaf3ff" stroke="#77a8de" stroke-width="2"/><text x="205" y="265" font-weight="700" fill="#174a7e">DISCOVER</text><text x="205" y="294" fill="#31465a">Crawl and data</text><rect x="365" y="220" width="180" height="115" rx="7" fill="#fff3e4" stroke="#e5a24b" stroke-width="2"/><text x="455" y="265" font-weight="700" fill="#8a4b00">DIAGNOSE</text><text x="455" y="294" fill="#31465a">Patterns and causes</text><rect x="655" y="220" width="180" height="115" rx="7" fill="#eaf7ef" stroke="#69b78d" stroke-width="2"/><text x="745" y="265" font-weight="700" fill="#176b4b">PRIORITIZE</text><text x="745" y="294" fill="#31465a">Impact and confidence</text><rect x="925" y="220" width="180" height="115" rx="7" fill="#f1edfb" stroke="#9a82c7" stroke-width="2"/><text x="1015" y="265" font-weight="700" fill="#5f488b">VERIFY</text><text x="1015" y="294" fill="#31465a">Release and re-crawl</text><path d="M295 277h55M545 277h95M835 277h75" stroke="#6b7f93" stroke-width="4"/><text x="600" y="460" font-size="25" font-weight="700" fill="#172a3a">THE OUTPUT IS NOT A LIST OF WARNINGS.</text><text x="600" y="492" font-size="20" fill="#51677b">It is an evidence-backed plan for the pages that matter.</text></g></svg>
