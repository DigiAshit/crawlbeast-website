<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Law firm search to intake journey</title><desc id="desc">Five stages show discovery, qualification, trust, contact, and measurement.</desc>
  <rect width="1200" height="650" fill="#f7f9fc"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172a3a">Audit the prospect's complete search journey</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2"><rect x="55" y="145" width="200" height="270" rx="8" fill="#dcecff" stroke="#6d9ed4"/><rect x="278" y="145" width="200" height="270" rx="8" fill="#e4f6ed" stroke="#5eae83"/><rect x="501" y="145" width="200" height="270" rx="8" fill="#fff0dc" stroke="#dda158"/><rect x="724" y="145" width="200" height="270" rx="8" fill="#f0eafb" stroke="#9274c4"/><rect x="947" y="145" width="200" height="270" rx="8" fill="#ffe8e4" stroke="#d56d60"/></g>
    <g font-size="19" font-weight="700"><text x="155" y="195" fill="#174a7e">1. DISCOVER</text><text x="378" y="195" fill="#176b4b">2. QUALIFY</text><text x="601" y="195" fill="#8a4b00">3. TRUST</text><text x="824" y="195" fill="#55348d">4. CONTACT</text><text x="1047" y="195" fill="#9b3428">5. MEASURE</text></g>
    <g font-size="16" fill="#31465a"><text x="155" y="250">Practice + location</text><text x="155" y="285">Organic + local</text><text x="155" y="320">Right landing page</text><text x="378" y="250">Matter accepted</text><text x="378" y="285">Jurisdiction served</text><text x="378" y="320">Clear next step</text><text x="601" y="250">Attorney identity</text><text x="601" y="285">Accurate evidence</text><text x="601" y="320">Current guidance</text><text x="824" y="250">Call or form</text><text x="824" y="285">Mobile access</text><text x="824" y="320">Correct routing</text><text x="1047" y="250">Qualified inquiry</text><text x="1047" y="285">Consultation</text><text x="1047" y="320">Accepted matter</text></g>
    <g font-size="15" font-weight="700" fill="#172a3a"><text x="155" y="382">Can they find us?</text><text x="378" y="382">Are we relevant?</text><text x="601" y="382">Can they rely on us?</text><text x="824" y="382">Can they act?</text><text x="1047" y="382">Did it help?</text></g>
  </g>
  <rect x="60" y="470" width="1080" height="110" rx="7" fill="#172a3a"/><text x="600" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9fc5ef">AUDIT RULE</text><text x="600" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">A failure at any stage can break the value of every stage before it.</text>
</svg>
