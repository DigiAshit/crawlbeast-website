    <g font-size="15" font-weight="700" fill="#31465a" text-anchor="middle"><text x="186" y="309">CATEGORY</text><text x="346" y="309">PRODUCT</text><text x="186" y="453">FILTER</text><text x="346" y="453">GUIDE</text></g>
    <path d="M466 338h92" stroke="#6b7f93" stroke-width="5"/><path d="m544 326 16 12-16 12" fill="none" stroke="#6b7f93" stroke-width="5"/>
    <rect x="582" y="174" width="250" height="342" rx="7" fill="#172a3a"/>
